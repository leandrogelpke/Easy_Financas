name: Atualizar Dashboard (Bling)

# Agente principal — atualiza o dashboard Easy Analytics com dados frescos
# do Bling 3x ao dia (horário de Brasília, UTC-3) e publica no GitHub Pages.
# Minuto :11 (NÃO :00) de propósito: o GitHub atrasa/derruba crons no minuto
# cheio sob carga. https://docs.github.com/actions → "schedule" (best-effort).
#   '11 10 * * *' → 07h11 BRT
#   '11 15 * * *' → 12h11 BRT
#   '11 19 * * *' → 16h11 BRT
on:
  schedule:
    - cron: '11 10 * * *'
    - cron: '11 15 * * *'
    - cron: '11 19 * * *'
    # TEMPORÁRIO — teste de fumaça do agendador (remover após confirmar):
    - cron: '50 15 * * *'
    # TEMPORÁRIO (21/08) — reexecuta o bootstrap de 24m que falhou às 16h11
    # e valida a captura de erro do fetch. REMOVER depois de 1-2 rodadas ok.
    # Cron do GitHub é best-effort: pode atrasar 5-15 min.
    - cron: '0 21 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      janela_meses:
        description: >-
          Meses de histórico no fetch (filtro por data de EMISSÃO). O padrão 7
          cobre a operação do dia a dia. Use um valor grande (ex.: 24) numa
          rodada manual pra reconstruir o histórico — parcelamentos longos são
          emitidos uma vez só e ficam fora de janelas curtas.
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: easy-financas-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # 30 min cobre a rodada normal (~3 min) com folga. O teto maior existe pro
    # bootstrap do histórico, que busca 24 meses com detalhe item a item
    # (~1,5s por lançamento por causa do rate limit do Bling).
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Marca início
        id: inicio
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Restaurar credenciais do Bling (a partir dos Secrets)
        env:
          BLING_OAUTH: ${{ secrets.BLING_OAUTH }}
          BLING_TOKEN: ${{ secrets.BLING_TOKEN }}
        run: |
          printf '%s' "$BLING_OAUTH" > .bling-oauth.json
          printf '%s' "$BLING_TOKEN" > .bling-tokens.json
          # cópia de referência p/ detectar rotação do refresh_token
          cp .bling-tokens.json .bling-tokens.orig.json
          chmod 600 .bling-oauth.json .bling-tokens.json
          python3 -c "import json; json.load(open('.bling-oauth.json')); json.load(open('.bling-tokens.json')); print('[ok] credenciais válidas (JSON)')"

      # Cache de retomada do fetch. Só importa no bootstrap: se a rodada de 24
      # meses estourar o tempo, a próxima retoma de onde parou em vez de
      # recomeçar. Na rodada normal é irrelevante (dura ~3 min).
      - name: Cache de retomada do fetch
        uses: actions/cache@v4
        with:
          path: data/bling-api/.cache
          key: bling-fetch-cache-${{ github.run_id }}
          restore-keys: bling-fetch-cache-

      - name: Fetch dados do Bling
        id: fetch
        continue-on-error: true
        env:
          JANELA_MESES: ${{ github.event.inputs.janela_meses || '' }}
        run: |
          # Janela deslizante por data de EMISSÃO. Cuidado: parcelamentos longos
          # são emitidos uma única vez, então uma janela curta faz TODAS as
          # parcelas sumirem de uma vez (ver ci/merge_historico.py). O merge com
          # o histórico logo abaixo é o que impede isso de virar buraco na DRE.
          #
          # Bootstrap automático: sem historico.json ainda, a primeira rodada
          # busca 24 meses pra semear o arquivo com dado autoritativo. Assim o
          # backfill não depende de alguém lembrar de disparar na mão.
          if [ -n "$JANELA_MESES" ]; then
            N="$JANELA_MESES"; MOTIVO="pedido no workflow_dispatch"
          elif [ ! -f data/bling-api/historico.json ]; then
            N=24; MOTIVO="bootstrap — historico.json ainda não existe"
          else
            N=7;  MOTIVO="rodada normal"
          fi
          DI=$(N="$N" python3 -c "
          import os
          from datetime import date, timedelta
          d = date.today().replace(day=1)
          for _ in range(int(os.environ['N'])):
              d = (d - timedelta(days=1)).replace(day=1)
          print(d.strftime('%Y-%m-%d'))")
          echo "WINDOW_START=$DI" >> "$GITHUB_ENV"
          echo "[fetch] janela: $DI → hoje ($N meses · $MOTIVO)"
          mkdir -p data/bling-api
          # stdout+stderr vão pro fetch_run.log; write_update_log anexa o tail
          # ao logs/update_*.json quando o fetch falha — a rodada de 21/08 16h
          # morreu em 14s e o log só dizia "não concluiu" (cegueira operacional).
          set -o pipefail
          python3 fetch-bling.py --out data/bling-api --data-inicial "$DI" --no-detail-receber 2>&1 | tee fetch_run.log

      - name: Merge com o histórico acumulado
        id: merge
        # Roda mesmo se o fetch falhou parcialmente: o histórico é o que garante
        # que lançamentos fora da janela (buy-out, parcelamentos longos) sigam
        # visíveis na DRE. Sem WINDOW_START o merge é aditivo, nunca remove.
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python3 ci/merge_historico.py --dir data/bling-api --window-start "$WINDOW_START"

      - name: Salvar token rotacionado de volta no Secret
        id: token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f .bling-tokens.json ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if cmp -s .bling-tokens.json .bling-tokens.orig.json; then
            echo "[token] inalterado (access_token ainda válido) — nada a salvar"
            echo "status=unchanged" >> "$GITHUB_OUTPUT"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::token do Bling rotacionou mas GH_PAT não está configurado — não foi possível persistir. Próxima execução pode falhar."
            echo "status=rotated_not_saved" >> "$GITHUB_OUTPUT"
          else
            gh secret set BLING_TOKEN --repo "$GITHUB_REPOSITORY" < .bling-tokens.json
            echo "[token] refresh_token rotacionado — Secret BLING_TOKEN atualizado"
            echo "status=rotated_saved" >> "$GITHUB_OUTPUT"
          fi

      # ── Drive pull (Totvs + Cartão) — substitui as etapas 1/1.5 do weekly.sh ──
      # Se o Secret GDRIVE_SA_KEY existir, o CI baixa do Drive e regenera os
      # snapshots; se não existir, pula tudo e mantém os snapshots commitados.
      - name: Detectar credencial do Drive
        id: drive_creds
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -n "$GDRIVE_SA_KEY" ]; then
            printf '%s' "$GDRIVE_SA_KEY" > /tmp/gdrive_sa.json
            python3 -c "import json; json.load(open('/tmp/gdrive_sa.json')); print('[ok] SA JSON válido')"
            echo "has_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "[skip] Secret GDRIVE_SA_KEY ausente — Totvs/Cartão mantêm o snapshot commitado."
            echo "has_key=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deps p/ Drive + parsers (Totvs/Cartão)
        if: steps.drive_creds.outputs.has_key == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install --quiet openpyxl google-api-python-client google-auth

      - name: Drive pull (Totvs + Cartão)
        id: drive_pull
        if: steps.drive_creds.outputs.has_key == '1'
        continue-on-error: true
        env:
          GDRIVE_SA_KEY_FILE: /tmp/gdrive_sa.json
        run: python3 ci/drive_pull.py

      - name: Regenerar snapshots Totvs/Cartão (só se baixou algo novo)
        id: regen
        if: steps.drive_creds.outputs.has_key == '1' && steps.drive_pull.outcome == 'success'
        continue-on-error: true
        run: |
          ST=ci/.drive_pull_status.json
          N_TOTVS=$(python3 -c "import json;print(json.load(open('$ST')).get('totvs',0))" 2>/dev/null || echo 0)
          N_CARTAO=$(python3 -c "import json;print(json.load(open('$ST')).get('cartao',0))" 2>/dev/null || echo 0)
          echo "[regen] baixados: $N_TOTVS Totvs, $N_CARTAO cartão"

          # --- TOTVS --- (fetch-totvs faz MERGE no snapshot commitado, dedup por hash)
          if [ "$N_TOTVS" -gt 0 ]; then
            python3 fetch-totvs.py --in totvs/raw --out data/bling-api/totvs_snapshot.json \
              || echo "::warning::fetch-totvs falhou"
            # bridge TEMPORÁRIO: planilha interna FATURAMENTO_MM.AAAA (layout != ASE806).
            # Remover quando o Relatório de Comissão oficial do mês passar a chegar no Drive.
            for f in totvs/raw/FATURAMENTO_[0-9][0-9].20[0-9][0-9].xlsx; do
              [ -e "$f" ] || continue
              comp=$(basename "$f" | sed -E 's/FATURAMENTO_([0-9]{2})\.([0-9]{4})\.xlsx/\2-\1/')
              python3 ingest_totvs_interno.py --xlsx "$f" --competencia "$comp" \
                --snapshot data/bling-api/totvs_snapshot.json --only-if-absent \
                && echo "[totvs] bridge $comp aplicado ($(basename "$f"))" \
                || echo "::warning::bridge totvs $comp falhou"
            done
            python3 ci/snapshot_guard.py --file data/bling-api/totvs_snapshot.json --kind totvs || true
          else
            echo "[totvs] sem arquivos do Drive — mantém snapshot commitado"
            git checkout -- data/bling-api/totvs_snapshot.json 2>/dev/null || true
          fi

          # --- CARTÃO ---
          if [ "$N_CARTAO" -gt 0 ]; then
            python3 fetch-cartao.py --in cartao/raw --out cartao_snapshot.json \
              || echo "::warning::fetch-cartao falhou"
            python3 ci/snapshot_guard.py --file cartao_snapshot.json --kind cartao || true
          else
            echo "[cartao] sem PDFs do Drive — mantém snapshot commitado"
            git checkout -- cartao_snapshot.json 2>/dev/null || true
          fi

      - name: Gerar index.html (build)
        id: build
        continue-on-error: true
        env:
          # totvs_snapshot.json mora DENTRO de data/bling-api porque o build
          # deriva o diretório dos CSVs do Bling de TOTVS_SNAP.parent — é de lá
          # que as abas Auditoria, P&L/DRE e A Pagar/Receber leem os CSVs.
          TOTVS_SNAP: data/bling-api/totvs_snapshot.json
          CARTAO_SNAP: cartao_snapshot.json
        run: python3 build-html.py --in data/bling-api --out index.html

      - name: Gate — testes de regressão (test_audit)
        id: gate_audit
        continue-on-error: true
        run: python3 test_audit.py

      - name: Gate — testes estruturais do HTML (test_build)
        id: gate_build
        continue-on-error: true
        run: python3 test_build.py

      - name: Gate — arquivo histórico (test_merge_historico)
        id: gate_merge
        continue-on-error: true
        run: python3 test_merge_historico.py

      - name: Auditor pré-commit (gate duro de dados/artefatos)
        id: precommit
        continue-on-error: true
        run: python3 ci/precommit_check.py

      - name: Commit & push do dashboard
        id: push
        # SÓ publica se TUDO passou: fetch + build + ambos os gates + auditor
        # pré-commit. Qualquer falha → mantém a última versão boa no ar.
        if: >-
          steps.fetch.outcome == 'success' &&
          steps.merge.outcome == 'success' &&
          steps.build.outcome == 'success' &&
          steps.gate_audit.outcome == 'success' &&
          steps.gate_build.outcome == 'success' &&
          steps.gate_merge.outcome == 'success' &&
          steps.precommit.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name  "Easy Analytics Bot"
          git config user.email "actions@users.noreply.github.com"
          # mantém só os 10 snapshots mais recentes versionados
          ls -1t data/bling-api/bling_data_*.json 2>/dev/null | tail -n +11 \
            | xargs -r git rm -f --ignore-unmatch
          git add index.html DRE_Projetado_Realizado.html 2>/dev/null || true
          git add data/bling-api/bling_data_*.json 2>/dev/null || true
          # histórico acumulado: precisa ser versionado, senão cada run começa
          # do zero e os lançamentos fora da janela somem de novo.
          git add data/bling-api/historico.json 2>/dev/null || true
          # snapshots Totvs/Cartão: o snapshot_guard já restaurou os sem dado
          # novo, então um 'add' aqui só encena diff quando houve arquivo novo.
          git add data/bling-api/totvs_snapshot.json cartao_snapshot.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[push] nada novo para commitar"
            echo "status=nothing" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')
            git commit -m "auto: dashboard $STAMP BRT" -m "Atualização automática via GitHub Actions (agente principal)."
            git push
            echo "[push] publicado"
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Gravar log da execução
        if: always()
        env:
          START_TS:    ${{ steps.inicio.outputs.ts }}
          OUT_FETCH:   ${{ steps.fetch.outcome }}
          OUT_MERGE:   ${{ steps.merge.outcome }}
          OUT_BUILD:   ${{ steps.build.outcome }}
          OUT_GATE_A:  ${{ steps.gate_audit.outcome }}
          OUT_GATE_B:  ${{ steps.gate_build.outcome }}
          OUT_GATE_M:  ${{ steps.gate_merge.outcome }}
          OUT_PRECOMMIT: ${{ steps.precommit.outcome }}
          OUT_PUSH:    ${{ steps.push.outputs.status }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          TOKEN_STATUS: ${{ steps.token.outputs.status }}
          COMMIT_SHA:  ${{ steps.push.outputs.sha }}
          TRIGGER:     ${{ github.event_name }}
          RUN_ID:      ${{ github.run_id }}
          RUN_NUMBER:  ${{ github.run_number }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ci/write_update_log.py

      - name: Commit & push do log
        if: always()
        run: |
          git config user.name  "Easy Analytics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[log] nada para commitar"
          else
            git commit -m "log: execução do agente principal [skip ci]"
            # rebase defensivo caso o push do dashboard e o do log corram juntos
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Falhar o job se o gate pré-commit bloqueou a publicação
        if: always()
        env:
          OUT_FETCH:     ${{ steps.fetch.outcome }}
          OUT_BUILD:     ${{ steps.build.outcome }}
          OUT_GATE_A:    ${{ steps.gate_audit.outcome }}
          OUT_GATE_B:    ${{ steps.gate_build.outcome }}
          OUT_PRECOMMIT: ${{ steps.precommit.outcome }}
        run: |
          fail=0
          for s in FETCH BUILD GATE_A GATE_B PRECOMMIT; do
            v=$(eval echo \$OUT_$s)
            if [ "$v" != "success" ]; then
              echo "::error::etapa $s = $v (publicação bloqueada — última versão boa mantida no ar)"
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "[gate] todas as etapas críticas OK — dashboard publicado." || exit 1
